name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ccp, POSTGRES_PASSWORD: ccp_dev_only, POSTGRES_DB: ccp }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccp" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm lint --if-present
      - run: pnpm typecheck --if-present
      - run: pnpm test --if-present
